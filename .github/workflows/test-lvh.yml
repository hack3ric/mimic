name: Run tests in LVH

on:
  push:
    paths:
      - .github/workflows/test-lvh.yml
      - "**.c"
      - "**.h"
      - "**/Makefile"
      - "!tools/**"
      - tools/test-vm
      - tools/vm/**
  pull_request:
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Mimic CLI executable
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64] # TODO: arm64 (bpftool not working)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build CLI matrix in container
        run: tools/test-vm build --ci-matrix
      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: mimic-${{ matrix.arch }}
          path: out/vm-binaries/
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: out/vm-build/

  test-lvh:
    name: Test LVH
    needs: build-exe
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
        kernel: ["6.1", "6.6", "6.12", "6.18"]
        # Disabled pending compatibility fixes: bpf-next
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          name: mimic-${{ matrix.arch }}
          path: out/vm-binaries
      - name: Install host VM dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openssh-client curl git jq rsync util-linux iproute2
          sudo chown "$(id -u):$(id -g)" /dev/kvm
      - name: Resolve kernel and cache keys
        id: assets
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          tools/test-vm prepare --kernel "$KERNEL" --resolve-only > /tmp/vm-assets.json
          jq -r 'to_entries[] | "\(.key)=\(.value)"' /tmp/vm-assets.json >> "$GITHUB_OUTPUT"
      - name: Cache root image
        id: root-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.assets.outputs.root_path }}
          key: ${{ steps.assets.outputs.root_key }}
      - name: Cache kernel
        id: kernel-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.assets.outputs.kernel_path }}
          key: ${{ steps.assets.outputs.kernel_key }}
      - name: Prepare VM assets
        env:
          KERNEL: ${{ matrix.kernel }}
          REVISION: ${{ steps.assets.outputs.revision }}
        run: tools/test-vm prepare --kernel "$KERNEL" --kernel-revision "$REVISION"
      # Save prepared assets even when Mimic subsequently fails verification.
      - name: Save root image
        if: steps.root-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.assets.outputs.root_path }}
          key: ${{ steps.assets.outputs.root_key }}
      - name: Save kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.assets.outputs.kernel_path }}
          key: ${{ steps.assets.outputs.kernel_key }}
      - name: Check Mimic in VM
        env:
          KERNEL: ${{ matrix.kernel }}
          REVISION: ${{ steps.assets.outputs.revision }}
        run: tools/test-vm run --kernel "$KERNEL" --kernel-revision "$REVISION" --binaries-dir out/vm-binaries
      - name: Upload VM results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-${{ matrix.arch }}-${{ matrix.kernel }}
          path: |
            out/vm/
            out/vm-build/
