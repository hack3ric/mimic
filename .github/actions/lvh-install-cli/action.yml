name: Install LVH and host VM dependencies
description: Install the host tools required by tools/test-vm on an Ubuntu Actions runner
runs:
  using: composite
  steps:
    - name: Install host packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          qemu-system-x86 qemu-utils openssh-client curl git jq rsync util-linux iproute2
        sudo chown "$(id -u):$(id -g)" /dev/kvm
    - name: Install pinned LVH CLI
      shell: bash
      run: |
        source tools/vm/defaults.sh
        cid=$(docker create "quay.io/lvh-images/lvh:$LVH_VERSION")
        temporary=$(mktemp -d)
        trap 'docker rm "$cid" >/dev/null; rm -rf "$temporary"' EXIT
        docker cp "$cid:/usr/bin/lvh" "$temporary/lvh"
        sudo install -m 0755 "$temporary/lvh" /usr/local/bin/lvh
